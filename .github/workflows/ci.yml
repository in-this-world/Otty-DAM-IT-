name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, unit tests
        run: npm run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: npm run e2e
        env:
          CI: 'true'
      - name: Generate missing visual baselines and commit (main only)
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          npx playwright test --update-snapshots
          if [[ -n "$(git status --porcelain tests/e2e/__screenshots__)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/e2e/__screenshots__
            git commit -m "test(e2e): add CI-generated linux visual baselines"
            git push origin HEAD:main
          else
            echo "No new/changed baselines to commit."
          fi
      - name: Upload Playwright report and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
